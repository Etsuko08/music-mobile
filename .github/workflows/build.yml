name: CI & Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_release:
    name: Build ARM64 GMS Release APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Signing Keystores
        run: |
          mkdir -p ~/.android app/keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Etsuko,O=Etsuko,C=IN"
          fi
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkey -v \
              -keystore app/keystore/release.keystore \
              -storepass etsukokey \
              -alias etsuko \
              -keypass etsukokey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Etsuko,O=Etsuko,C=IN"
          fi

      - name: Build Optimized Release APK
        env:
          _JAVA_OPTIONS: "-Xmx6g -XX:ReservedCodeCacheSize=512m"
          STORE_PASSWORD: "etsukokey"
          KEY_ALIAS: "etsuko"
          KEY_PASSWORD: "etsukokey"
        run: |
          ./gradlew assembleArm64GmsRelease -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -XX:ReservedCodeCacheSize=512M" --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-mobile-apk
          path: app/build/outputs/apk/**/release/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties | cut -d= -f2)
          VERSION_MINOR=$(grep -E '^VERSION_MINOR=' version.properties | cut -d= -f2)
          VERSION_PATCH=$(grep -E '^VERSION_PATCH=' version.properties | cut -d= -f2)
          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          TAG="v${VERSION_NAME}"
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "etsuko-mobile.apk"
            APK_SIZE=$(stat -c%s "etsuko-mobile.apk")
            APK_SIZE_MB=$((APK_SIZE / 1048576))
            echo "APK: $APK_PATH ($APK_SIZE_MB MB) as $TAG"

            NOTES="Etsuko Mobile v${VERSION_NAME} - Radio continuation and smart queue overhaul: Home cards now launch real YouTube Radio instead of dead-ending; search result song taps start radio from that song then continue with genre-matched tracks (no more all-misery loops); same-title/remix deduplication prevents the first 20 radio slots flooding with slowed/sped-up variants; end-of-playlist auto-extends via radio when Repeat is OFF; PlayerMapper tab detection fixed by page-type so Related/Lyrics endpoints survive YouTube tab reorders; HomeViewModel Quick Picks now inserts new YT songs into DB for genuinely fresh picks; Charts page fetches local + US + global charts simultaneously; video-song radio survival when Hide Video Songs is on; stale automix cleared on new queue; LocalAlbumRadio guarded for local albums. Includes all v1.8.3 search and library radio fixes."
            gh release create "$TAG" "etsuko-mobile.apk" \
              --repo "${{ github.repository }}" \
              --title "Etsuko Mobile $TAG" \
              --notes "$NOTES" \
              || gh release upload "$TAG" "etsuko-mobile.apk" --repo "${{ github.repository }}" --clobber
          else
            echo "No APK found to release."
          fi
