name: CI & Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_debug:
    name: Build ARM64 GMS APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Etsuko,O=Etsuko,C=IN"

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx6g -XX:ReservedCodeCacheSize=512m"
        run: |
          ./gradlew assembleArm64GmsDebug -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -XX:ReservedCodeCacheSize=512M" --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-mobile-apk
          path: app/build/outputs/apk/arm64Gms/debug/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0"
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "etsuko-mobile.apk"
            APK_SIZE=$(stat -c%s "etsuko-mobile.apk")
            APK_SIZE_MB=$((APK_SIZE / 1048576))
            echo "APK: $APK_PATH ($APK_SIZE_MB MB)"

            gh release delete v1.0.0 --repo "${{ github.repository }}" --yes 2>/dev/null || true
            git push --delete origin v1.0.0 2>/dev/null || true

            NOTES="Etsuko Mobile v1.1.0 - ARM64 build with com.etsuko.music identity. Download and tap to install."
            gh release create "$TAG" "etsuko-mobile.apk" \
              --repo "${{ github.repository }}" \
              --title "Etsuko Mobile v1.1.0" \
              --notes "$NOTES" \
              || gh release upload "$TAG" "etsuko-mobile.apk" --repo "${{ github.repository }}" --clobber
          else
            echo "No APK found to release."
          fi
