name: CI & Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_debug:
    name: Build Universal GMS Debug APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        env:
          _JAVA_OPTIONS: "-Xmx6g -XX:ReservedCodeCacheSize=512m"
        run: |
          ./gradlew assembleUniversalGmsDebug -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -XX:ReservedCodeCacheSize=512M" --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-mobile-apk
          path: app/build/outputs/apk/universalGms/debug/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "etsuko-mobile.apk"
            echo "Found APK at $APK_PATH, creating release..."
            gh release create "$TAG" "etsuko-mobile.apk" \
              --repo "${{ github.repository }}" \
              --title "Etsuko Mobile v1.0.0" \
              --notes "### Etsuko Mobile (Android APK)
          - Signature Etsuko violet-blue ambient gradient home screen
          - Full fluid glassmorphism & Cupertino iconography
          - Local & Liked music library
          - High-quality audio streaming engine" \
              || gh release upload "$TAG" "etsuko-mobile.apk" --repo "${{ github.repository }}" --clobber
          else
            echo "No APK found to release."
          fi
