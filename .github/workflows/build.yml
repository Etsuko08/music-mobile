name: CI & Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_debug:
    name: Build Universal GMS Debug APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          ./gradlew assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: etsuko-mobile-apk
          path: app/build/outputs/apk/universalGms/debug/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          name: Etsuko Mobile v1.0.0
          body: |
            ### Etsuko Mobile (Android APK)
            - Signature Etsuko violet-blue ambient gradient home screen
            - Full fluid glassmorphism & Cupertino iconography
            - Local & Liked music library
            - High-quality audio streaming engine
          files: app/build/outputs/apk/universalGms/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
