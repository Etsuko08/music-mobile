name: CI & Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build_release:
    name: Build ARM64 GMS Release APK
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Signing Keystores
        run: |
          mkdir -p ~/.android app/keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Etsuko,O=Etsuko,C=IN"
          fi
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkey -v \
              -keystore app/keystore/release.keystore \
              -storepass etsukokey \
              -alias etsuko \
              -keypass etsukokey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Etsuko,O=Etsuko,C=IN"
          fi

      - name: Build Optimized Release APK
        env:
          _JAVA_OPTIONS: "-Xmx6g -XX:ReservedCodeCacheSize=512m"
          STORE_PASSWORD: "etsukokey"
          KEY_ALIAS: "etsuko"
          KEY_PASSWORD: "etsukokey"
        run: |
          ./gradlew assembleArm64GmsRelease -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC -XX:ReservedCodeCacheSize=512M" --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsuko-mobile-apk
          path: app/build/outputs/apk/**/release/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.7.6"
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "etsuko-mobile.apk"
            APK_SIZE=$(stat -c%s "etsuko-mobile.apk")
            APK_SIZE_MB=$((APK_SIZE / 1048576))
            echo "APK: $APK_PATH ($APK_SIZE_MB MB)"

            NOTES="Etsuko Mobile v1.7.6 - Full Etsuko split-disc branding restoration across installer, home screen, and theme picker; fixed Auto audio quality defaulting to high-fidelity streams on 5G; seamless 2MB chunk buffering preventing mid-track cutoffs; and persistent release signing."
            gh release create "$TAG" "etsuko-mobile.apk" \
              --repo "${{ github.repository }}" \
              --title "Etsuko Mobile v1.7.6" \
              --notes "$NOTES" \
              || gh release upload "$TAG" "etsuko-mobile.apk" --repo "${{ github.repository }}" --clobber
          else
            echo "No APK found to release."
          fi
