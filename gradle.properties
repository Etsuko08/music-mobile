# Gradle & JVM settings optimized for GitHub Actions & CI
org.gradle.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:ReservedCodeCacheSize=512M -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=daemon
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=false
android.nonTransitiveRClass=false
android.newDsl=false

# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Disable caching for SNAPSHOT dependencies
org.gradle.caching=false
org.gradle.tooling.parallel=false
